{% extends 'base.html' %}

{% block title %}Login - CGPA Calculator{% endblock %}

{% block content %}
<div class="container">
    <div class="glass-panel">
        <h2>Welcome Back</h2>
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="login_id">Username or Email</label>
                <input type="text" id="login_id" name="login_id" required placeholder="Enter your username or email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                        <i data-lucide="eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 1rem;">Login</button>
        </form>
        
        <div style="text-align: center; margin: 1.5rem 0; color: var(--text-muted); position: relative;">
            <hr style="border: 0; border-top: 1px solid var(--glass-border); position: absolute; width: 100%; top: 50%; z-index: 1;">
            <span style="background: var(--bg-color); padding: 0 10px; position: relative; z-index: 2; font-size: 0.9rem;">OR</span>
        </div>

        <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
            <div id="g_id_onload"
                 data-client_id="651086801146-94dj14nbm04ntbpu0c4dpm8atf1ekstd.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>
        <div class="auth-links">
            Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i, svg');
    if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i data-lucide="eye-off"></i>';
    } else {
        input.type = 'password';
        btn.innerHTML = '<i data-lucide="eye"></i>';
    }
    lucide.createIcons();
}

function handleCredentialResponse(response) {
    fetch('/google_login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ credential: response.credential })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            window.location.href = "{{ url_for('calculator') }}";
        } else {
            alert(data.message || "Google Login Failed.");
        }
    })
    .catch(err => {
        console.error(err);
        alert("An error occurred during Google Login.");
    });
}
</script>
{% endblock %}
